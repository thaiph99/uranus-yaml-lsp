apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: name
spec:
  templates:
    - name: template
      container:
        image: alpine
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: value-overlap-
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: run-template
            templateRef:
              name: name
              template: template
